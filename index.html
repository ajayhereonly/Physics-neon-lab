<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhysicaLive — Interactive Classroom Physics Formula Simulator</title>
    <meta
      name="description"
      content="High-contrast Black & White projector-ready bilingual (English & Hindi) Class 11-12 physics formula live simulation lab with line-coded vectors, real-time graphs, Presenter Mode, chalkboard annotation, What-If proofs, and AI custom formula simulation."
    />
    <meta property="og:title" content="PhysicaLive — Interactive Classroom Physics Formula Simulator" />
    <meta
      property="og:description"
      content="Turn Class 11-12 physics formulas into hands-on 60fps high-contrast Black & White classroom projector simulations with bilingual English/Hindi guides and AI custom formula labs."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500..700;1,9..40,500..600&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('physicalive_bw_polarity');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-black dark:bg-black dark:text-white antialiased selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
